<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Chassis UI — Signup</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #0f0f23;
      color: #e6e6e6;
      line-height: 1.6;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .header-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 1rem 1.5rem;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(102, 126, 234, 0.3);
      margin-bottom: 2rem;
      width: 100%;
      max-width: 400px;
    }

    .header-bar h1 {
      margin: 0;
      font-size: 1.8rem;
      font-weight: 600;
      color: #fff;
      background: none;
      box-shadow: none;
      padding: 0;
    }

    .signup-container {
      background: #1a1a2e;
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 400px;
      border: 1px solid #2d3748;
    }

    #signupForm {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    #signupForm input {
      padding: 1rem;
      background: #2d3748;
      border: 1px solid #4a5568;
      border-radius: 8px;
      color: #e2e8f0;
      font-size: 1rem;
      font-family: inherit;
      transition: all 0.2s ease;
    }

    #signupForm input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.2);
    }

    #signupForm input::placeholder {
      color: #a0aec0;
    }

    #signupForm button {
      padding: 1rem;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 500;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: 0.5rem;
    }

    #signupForm button:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    #status {
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      background: #e53e3e;
      color: white;
      border-radius: 8px;
      font-size: 0.9rem;
      text-align: center;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    #status.show {
      opacity: 1;
    }

    .login-link {
      text-align: center;
      margin-top: 1.5rem;
      color: #a0aec0;
    }

    .login-link a {
      color: #667eea;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s ease;
    }

    .login-link a:hover {
      color: #a3bffa;
    }
  </style>
</head>
<body>
  <div class="header-bar">
    <h1>Chassis UI — Signup</h1>
  </div>
  
  <div class="signup-container">
    <form id="signupForm">
      <input type="text" id="name" placeholder="Name" required />
      <input type="email" id="email" placeholder="Email" required />
      <input type="password" id="password" placeholder="Password (min 8 chars)" required minlength="8" />
      <button type="submit">Create Account</button>
    </form>
    
    <div class="login-link">
      Already have an account? <a href="/l">Login here</a>
    </div>
  </div>

  <div id="status"></div>

  <script>
    const statusEl = document.getElementById("status");
    const signupForm = document.getElementById("signupForm");

    function showStatus(message, isError = true) {
      statusEl.textContent = message;
      statusEl.style.background = isError ? '#e53e3e' : '#38a169';
      statusEl.classList.add('show');
      setTimeout(() => {
        statusEl.classList.remove('show');
      }, 5000);
    }

    async function autoLogin() {
      try {
        const res = await fetch("/auto-login");
        if (!res.ok) throw new Error();
        // If already logged in, redirect to /chats
        window.location = "/chats";
      } catch {
        // Not logged in, stay on signup
      }
    }

    signupForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const name = document.getElementById("name").value;

      try {
        const res = await fetch("/signup", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password, name }),
        });
        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.detail || "Signup failed");
        }
        // On successful signup, redirect to /chats
        showStatus("Account created successfully! Redirecting...", false);
        setTimeout(() => {
        window.location = "/chats";
        }, 1000);
      } catch (err) {
        showStatus(err.message);
      }
    });

    // Try auto-login on page load
    autoLogin();
  </script>
</body>
</html>
